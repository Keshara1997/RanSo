services:
  ranso:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_ENVIRONMENT_OPTIONS=--configuration production
        - BUILDER_IMAGE=node:20-alpine
        - NGINX_IMAGE=nginx:1.19.3
        - NPM_REGISTRY_URL=https://registry.npmjs.org/
        - PUPPETEER_DOWNLOAD_HOST_ARG=https://storage.googleapis.com
        - PUPPETEER_CHROMIUM_REVISION_ARG=1011831
    ports:
      - '4200:80'
    volumes:
      # Mount nginx template so /fineract-provider is proxied to Fineract
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # Upstream used only by nginx (browser never talks to this host directly)
      - FINERACT_PROXY_TARGET=https://52.207.60.240:8443
      # Empty so Angular uses same-origin (http://localhost:4200) → nginx proxy
      - FINERACT_API_URL=
      - FINERACT_API_URLS=
      - FINERACT_API_PROVIDER=/fineract-provider/api
      - FINERACT_API_VERSION=/v1
      - FINERACT_PLATFORM_TENANT_IDENTIFIER=default
      - MIFOS_DEFAULT_LANGUAGE=en-US
      - MIFOS_SUPPORTED_LANGUAGES=cs-CS,de-DE,en-US,es-MX,es-CL,fr-FR,it-IT,ko-KO,lt-LT,lv-LV,ne-NE,pt-PT,sw-SW
      - MIFOS_SESSION_IDLE_TIMEOUT=300000
      - MIFOS_PRELOAD_CLIENTS=true
      - MIFOS_DEFAULT_CHAR_DELIMITER=,
      # Placeholders for optional proxies in nginx.conf.template
      - EXTERNAL_NATIONALID_API_URL=
      - EXTERNAL_NATIONAL_ID_SYSTEM_API_HEADER=X-Gravitee-Api-Key
      - EXTERNAL_NATIONAL_ID_SYSTEM_API_KEY=
      - MIFOS_REMITTANCE_API_URL=
      - MIFOS_REMITTANCE_API_HEADER=X-Gravitee-Api-Key
      - MIFOS_REMITTANCE_API_KEY=
    # Dockerfile CMD starts with /bin/sh, so the nginx image skips template
    # processing. Process the nginx + env.js templates explicitly (same as e2e).
    command: >-
      /bin/sh -c "
      envsubst '$$FINERACT_PROXY_TARGET $$EXTERNAL_NATIONALID_API_URL $$EXTERNAL_NATIONAL_ID_SYSTEM_API_HEADER $$EXTERNAL_NATIONAL_ID_SYSTEM_API_KEY $$MIFOS_REMITTANCE_API_URL $$MIFOS_REMITTANCE_API_HEADER $$MIFOS_REMITTANCE_API_KEY'
      < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf &&
      envsubst < /usr/share/nginx/html/assets/env.template.js > /usr/share/nginx/html/assets/env.js &&
      nginx -g 'daemon off;'
      "
